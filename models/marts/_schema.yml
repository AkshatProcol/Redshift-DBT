version: 2

models:
  - name: fact_vendor
    description: "Comprehensive vendor data with POCs as separate rows"
    columns:
      - name: vendor_id_poc_id
        description: "Composite unique key combining vendor_id and poc_id"
        tests:
          - not_null
          - unique
      - name: client_company_id
        description: "Client company ID (hardcoded as 12855)"
        tests:
          - not_null
      - name: vendor_id
        description: "Vendor company ID"
        tests:
          - not_null
      - name: vendor_name
        description: "Vendor company name"
      - name: vendor_email
        description: "Vendor company email"
      - name: primary_contact_phone
        description: "Primary contact phone (company or POC)"
      - name: gst_no
        description: "GST number"
      - name: city_name
        description: "City name"
      - name: country_name
        description: "Country name"
      - name: address
        description: "Company address"
      - name: vendor_created_at
        description: "Vendor company creation date (epoch timestamp as bigint)"
      - name: vendor_type
        description: "Type of vendor (Broker Created Firm, Selling Firm, etc.)"
      - name: joining_status_label
        description: "Human readable joining status"
      - name: category_names
        description: "Array of product category names"
      - name: invited_by
        description: "User ID who invited the vendor"
      - name: invited_by_name
        description: "Name of user who invited the vendor"
      - name: invited_by_email
        description: "Email of user who invited the vendor"
      - name: poc_id
        description: "Point of Contact user ID"
      - name: poc_name
        description: "Point of Contact name"
      - name: poc_email
        description: "Point of Contact email"
      - name: poc_phone
        description: "Point of Contact phone"
      - name: tag_names
        description: "Array of tag names associated with vendor"
      - name: preferred_item_ids
        description: "Array of preferred item IDs"
      - name: score_value
        description: "Vendor score value"
      - name: vendor_code
        description: "Vendor code"
      - name: network_joined_date
        description: "Date when vendor joined the network (epoch timestamp as bigint)"
      - name: source
        description: "Source of vendor mapping"
      - name: is_verified
        description: "Whether vendor is verified"
      - name: misc
        description: "Miscellaneous vendor data"
      - name: archived_at
        description: "Archival timestamp (epoch timestamp as bigint)"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
        
  - name: fact_bids
    description: "Comprehensive bid data with user and company details"
    columns:
      - name: id
        description: "Bid ID (unique key)"
        tests:
          - not_null
          - unique
      - name: user_id
        description: "User who placed the bid"
        tests:
          - not_null
      - name: status
        description: "Bid status"
      - name: delivery_type
        description: "Delivery type for the bid"
      - name: company_id
        description: "Company placing the bid"
      - name: product_sample_id
        description: "Product sample ID"
      - name: city_id
        description: "City ID for delivery"
      - name: broker_id
        description: "Broker user ID"
      - name: broker_company_id
        description: "Broker company ID"
      - name: applicable_apmc_product_config_id
        description: "APMC product configuration ID"
      - name: contract_id
        description: "Associated contract ID"
      - name: session_id
        description: "Trading session ID"
      - name: approval_status
        description: "Bid approval status"
      - name: lock_version
        description: "Version for optimistic locking"
      - name: created_at
        description: "Creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
      - name: end_time
        description: "Bid end time"
      - name: start_time
        description: "Bid start time"
      - name: closed_at
        description: "Bid closure timestamp"
      - name: placed_at
        description: "Bid placement timestamp"
      - name: negotiable
        description: "Whether the bid is negotiable"
      - name: is_multi_product
        description: "Whether this is a multi-product bid"
      - name: price
        description: "Bid price"
      - name: quantity
        description: "Bid quantity"
      - name: gst
        description: "GST amount"
      - name: rank_price
        description: "Ranked price for comparison"
      - name: final_price
        description: "Final negotiated price"
      - name: amount
        description: "Total bid amount"
      - name: score
        description: "Bid score for ranking"
      - name: user_first_name
        description: "First name of the user who placed the bid"
      - name: user_last_name
        description: "Last name of the user who placed the bid"
      - name: company_name
        description: "Name of the company placing the bid"
      - name: city_name
        description: "Name of the delivery city"
        
  - name: fact_bid_trades
    description: "Bid trading and forwarding activity data"
    columns:
      - name: id
        description: "Bid trade ID (unique key)"
        tests:
          - not_null
          - unique
      - name: trade_request_id
        description: "Associated trade request ID"
      - name: bid_id
        description: "Associated bid ID"
        tests:
          - not_null
      - name: forwarded_by
        description: "User ID who forwarded the bid trade"
      - name: status
        description: "Bid trade status"
      - name: created_at
        description: "Creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
        
  - name: dim_buyer_hubs
    description: "Buyer hub dimension table with company enrichment"
    columns:
      - name: id
        description: "Primary key - Buyer hub ID"
        tests:
          - not_null
          - unique
      - name: buyer_hub_id
        description: "Buyer hub identifier (same as id)"
        tests:
          - not_null
      - name: name
        description: "Buyer hub name"
      - name: city_id
        description: "City ID where hub is located"
      - name: company_id
        description: "Company that owns this buyer hub"
        tests:
          - not_null
      - name: company_name
        description: "Company name (enriched from companies table)"
      - name: created_at
        description: "Hub creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
        
  - name: dim_buyer_hubs_disc
    description: "Buyer hub detailed attributes and descriptive information"
    columns:
      - name: buyer_hub_id
        description: "Buyer hub ID (unique key, references dim_buyer_hubs)"
        tests:
          - not_null
          - unique
      - name: status
        description: "Hub status code (1=active, 0=inactive, 2=other)"
      - name: coordinates
        description: "Geographic coordinates of the hub"
      - name: location_code
        description: "Hub location code identifier"
      - name: location_type
        description: "Location type code (1=warehouse, 2=office, 3=distribution_center, 0=other)"
      - name: address
        description: "Physical address of the hub"
      - name: zone_id
        description: "Zone ID for regional grouping"
      - name: misc
        description: "Additional hub metadata and miscellaneous information"
      - name: created_by
        description: "User ID who created this hub"
      - name: user_id
        description: "Primary user associated with this hub"
        
  - name: dim_buyer_seller_company_mappings
    description: "Buyer-seller company relationships and vendor mappings"
    columns:
      - name: id
        description: "Primary key - Mapping ID"
        tests:
          - not_null
          - unique
      - name: client_company_id
        description: "Client company ID (buyer)"
        tests:
          - not_null
      - name: dealing_with_company_id
        description: "Vendor/seller company ID"
        tests:
          - not_null
      - name: vendor_code
        description: "Vendor code assigned by client"
      - name: status
        description: "Mapping status (0=inactive, 1=active, etc.)"
      - name: created_at
        description: "Relationship creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
      - name: invited_by
        description: "User ID who created this relationship"
      - name: source
        description: "Source of the relationship mapping"
      - name: auto_discount
        description: "Auto discount configuration details"
      - name: vrp_code
        description: "VRP (Vendor Registration Program) code"
      - name: integration_status
        description: "Integration status with external systems"
      - name: meta_data
        description: "Additional metadata (JSON/SUPER)"
      - name: dms_upload_status
        description: "Document Management System upload status"

  - name: dim_cities
    description: "City dimension table with geographic and administrative data"
    columns:
      - name: id
        description: "Primary key - City ID"
        tests:
          - not_null
          - unique
      - name: name
        description: "City name"
        tests:
          - not_null
      - name: coordinates
        description: "Geographic coordinates of the city"
      - name: status
        description: "City status code (active/inactive)"
      - name: apmc_configuration_id
        description: "APMC (Agricultural Produce Market Committee) configuration ID"
      - name: state_id
        description: "State ID where city is located"
      - name: country_id
        description: "Country ID where city is located"
        tests:
          - not_null
      - name: created_at
        description: "City record creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"

  - name: dim_companies
    description: "Company dimension table with comprehensive business data"
    columns:
      - name: id
        description: "Primary key - Company ID"
        tests:
          - not_null
          - unique
      - name: name
        description: "Company name"
        tests:
          - not_null
      - name: image_url
        description: "Company logo/image URL"
      - name: address
        description: "Company physical address"
      - name: coordinates
        description: "Geographic coordinates of company location"
      - name: phone
        description: "Company primary phone number"
      - name: email
        description: "Company primary email address"
      - name: email_extension
        description: "Company email domain extension"
      - name: pan_no
        description: "PAN (Permanent Account Number) for tax purposes"
      - name: fssai_code
        description: "FSSAI (Food Safety Standards Authority) registration code"
      - name: gst_no
        description: "GST (Goods and Services Tax) registration number"
      - name: owner_name
        description: "Name of the company owner/proprietor"
      - name: year_of_establishment
        description: "Year when the company was established"
      - name: tan_number
        description: "TAN (Tax Deduction Account Number)"
      - name: number_of_employees
        description: "Total number of employees in the company"
      - name: domain
        description: "Company business domain/industry"
      - name: website
        description: "Company official website URL"
      - name: broker_for
        description: "Brokerage information and relationships (JSON/SUPER)"
      - name: document_images
        description: "Company registration and verification documents (JSON/SUPER)"
      - name: update_remarks
        description: "Administrative notes and update remarks (JSON/SUPER)"
      - name: allowed_modules
        description: "System modules and permissions assigned (JSON/SUPER)"
      - name: misc
        description: "Miscellaneous company metadata including scores (JSON/SUPER)"
      - name: recommendation_identifier
        description: "Company recommendation and referral data (JSON/SUPER)"
      - name: created_at
        description: "Company record creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"

  - name: dim_companies_disc
    description: "Company dimension table with comprehensive business data (descriptive attributes copy)"
    columns:
      - name: id
        description: "Primary key - Company ID (references dim_companies)"
        tests:
          - not_null
          - unique
      - name: name
        description: "Company name"
        tests:
          - not_null
      - name: image_url
        description: "Company logo/image URL"
      - name: address
        description: "Company physical address"
      - name: coordinates
        description: "Geographic coordinates of company location"
      - name: phone
        description: "Company primary phone number"
      - name: email
        description: "Company primary email address"
      - name: email_extension
        description: "Company email domain extension"
      - name: pan_no
        description: "PAN (Permanent Account Number) for tax purposes"
      - name: fssai_code
        description: "FSSAI (Food Safety Standards Authority) registration code"
      - name: gst_no
        description: "GST (Goods and Services Tax) registration number"
      - name: owner_name
        description: "Name of the company owner/proprietor"
      - name: year_of_establishment
        description: "Year when the company was established"
      - name: tan_number
        description: "TAN (Tax Deduction Account Number)"
      - name: number_of_employees
        description: "Total number of employees in the company"
      - name: domain
        description: "Company business domain/industry"
      - name: website
        description: "Company official website URL"
      - name: broker_for
        description: "Brokerage information and relationships (JSON/SUPER)"
      - name: document_images
        description: "Company registration and verification documents (JSON/SUPER)"
      - name: update_remarks
        description: "Administrative notes and update remarks (JSON/SUPER)"
      - name: allowed_modules
        description: "System modules and permissions assigned (JSON/SUPER)"
      - name: misc
        description: "Miscellaneous company metadata including scores (JSON/SUPER)"
      - name: recommendation_identifier
        description: "Company recommendation and referral data (JSON/SUPER)"
      - name: created_at
        description: "Company record creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"

  - name: dim_event_group
    description: "Event group dimension table for trading sessions and auction events"
    columns:
      - name: id
        description: "Primary key - Event group ID"
        tests:
          - not_null
          - unique
      - name: title
        description: "Event group title/name"
        tests:
          - not_null
      - name: status
        description: "Event group status (0=inactive, 1=active, 2=closed, etc.)"
      - name: user_id
        description: "User who created/manages the event group"
        tests:
          - not_null
      - name: company_id
        description: "Company that owns the event group"
        tests:
          - not_null
      - name: created_at
        description: "Event group creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
      - name: started_at
        description: "Event group start timestamp"
      - name: closed_at
        description: "Event group closure timestamp"
      - name: latest_stage_time
        description: "Timestamp of the latest stage/phase in the event"
      - name: ref_id
        description: "External reference ID for integration purposes"

  - name: dim_event_group_disc
    description: "Event group descriptive dimension table with complex configuration and metadata"
    columns:
      - name: id
        description: "Primary key - Event group ID (references dim_event_group)"
        tests:
          - not_null
          - unique
      - name: config
        description: "Event group configuration settings and parameters (JSON/SUPER)"
      - name: attachments
        description: "Event group attachments and document references (JSON/SUPER)"
      - name: terms_and_conditions
        description: "Terms and conditions text for the event group"
      - name: precomputed_data
        description: "Precomputed analytics and summary data (JSON/SUPER)"
      - name: lot_config
        description: "Lot-specific configuration for auction events (JSON/SUPER)"
      - name: closed_by_id
        description: "User ID who closed the event group"
      - name: precomputed_data_v1
        description: "Version 1 precomputed data (legacy format, JSON/SUPER)"
      - name: meta_data
        description: "Additional metadata and system information (JSON/SUPER)"
      - name: description_markdown
        description: "Event group description in Markdown format"

  - name: dim_orders
    description: "Order dimension table with complex order details and metadata"
    columns:
      - name: id
        description: "Primary key - Order ID (references fact_orders)"
        tests:
          - not_null
          - unique
      - name: quality_params
        description: "Product quality parameters and specifications (JSON/SUPER)"
      - name: terms_and_conditions
        description: "Order terms and conditions text"
      - name: purchase_order
        description: "Purchase order details and documentation (JSON/SUPER)"
      - name: price_breakup
        description: "Detailed price breakdown and calculations (JSON/SUPER)"
      - name: po_details
        description: "Purchase order administrative details (JSON/SUPER)"
      - name: template_data
        description: "Order template and format data (JSON/SUPER)"
      - name: order_items_summary
        description: "Summary of order items and quantities (JSON/SUPER)"
      - name: other_details
        description: "Additional order details and notes (JSON/SUPER)"
      - name: contract_details
        description: "Contract terms and legal details (JSON/SUPER)"
      - name: meta_data
        description: "Order metadata and system information (JSON/SUPER)"

  - name: dim_products
    description: "Product dimension table with core product attributes"
    columns:
      - name: id
        description: "Primary key - Product ID"
        tests:
          - not_null
          - unique
      - name: status
        description: "Product status (0=inactive, 1=active, etc.)"
      - name: category_id
        description: "Product category ID"
        tests:
          - not_null
      - name: company_id
        description: "Company that owns/created the product"
        tests:
          - not_null
      - name: configuration_id
        description: "Product configuration ID"
      - name: created_at
        description: "Product creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
      - name: created_by
        description: "User who created the product"
      - name: user_id
        description: "Primary user associated with the product"

  - name: dim_products_disc
    description: "Product descriptive dimension table with detailed attributes and metadata"
    columns:
      - name: id
        description: "Primary key - Product ID (references dim_products)"
        tests:
          - not_null
          - unique
      - name: name
        description: "Product name"
        tests:
          - not_null
      - name: product_type
        description: "Product type classification code"
      - name: product_code
        description: "Internal product code/SKU"
      - name: image_url
        description: "Product image URL"
      - name: alias
        description: "Product alias or alternative name"
      - name: article_code
        description: "Article code for inventory management"
      - name: update_remarks
        description: "Update notes and remarks"
      - name: audio_url
        description: "Product audio description URL"
      - name: hsn_code
        description: "HSN (Harmonized System of Nomenclature) code for taxation"
      - name: description
        description: "Product description and details (JSON/SUPER)"
      - name: options
        description: "Product options and variants (JSON/SUPER)"
      - name: misc
        description: "Miscellaneous product data and metadata (JSON/SUPER)"
      - name: quality_params
        description: "Product quality parameters and specifications (JSON/SUPER)"
      - name: origins
        description: "Product origin information (JSON/SUPER)"
      - name: terms_and_conditions
        description: "Product-specific terms and conditions (JSON/SUPER)"

  - name: dim_product_categories
    description: "Product category dimension table with hierarchical structure and attributes"
    columns:
      - name: id
        description: "Primary key - Product category ID"
        tests:
          - not_null
          - unique
      - name: name
        description: "Category name"
        tests:
          - not_null
      - name: ancestry
        description: "Hierarchical ancestry path (e.g., '1/2/3' for nested categories)"
      - name: status
        description: "Category status (0=inactive, 1=active, etc.)"
      - name: created_at
        description: "Category creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
      - name: hierarchy_type
        description: "Type of hierarchy structure"
      - name: alias
        description: "Category aliases and alternative names (JSON/SUPER)"
      - name: origins
        description: "Category origin information and sources (JSON/SUPER)"
      - name: gst
        description: "GST rate applicable to this category"
      - name: image_url
        description: "Category image URL"
      - name: category_type
        description: "Category classification type"
      - name: quality_params
        description: "Quality parameters for products in this category (JSON/SUPER)"
      - name: company_id
        description: "Company that owns/created the category (for custom categories)"
      - name: is_default_category
        description: "Whether this is a default system category"
      - name: category_code
        description: "Internal category code for classification"

  - name: dim_product_qualities
    description: "Product quality dimension table with quality parameters and specifications"
    columns:
      - name: id
        description: "Primary key - Product quality ID"
        tests:
          - not_null
          - unique
      - name: product_id
        description: "Product ID this quality specification belongs to"
        tests:
          - not_null
      - name: params
        description: "Quality parameters and specifications (JSON/SUPER)"
      - name: status
        description: "Quality specification status (0=inactive, 1=active, etc.)"
      - name: created_at
        description: "Quality specification creation timestamp"
      - name: updated_at
        description: "Last update timestamp for incremental processing"
      - name: name
        description: "Quality specification name/title"
        tests:
          - not_null
      - name: created_by_user_id
        description: "User who created this quality specification"
      - name: attachments
        description: "Quality specification attachments and documents (JSON/SUPER)"
